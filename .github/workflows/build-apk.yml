name: Android APK Olustur

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # GitHub arayüzünden tek tıkla manuel tetikleme imkanı verir

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo Kodlarini Cek
        uses: actions/checkout@v4

      - name: Node.js 20 Kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Java JDK 21 Kur (Capacitor Android Icin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: NPM Paketlerini Yukle ve Web Derlemesi Yap
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Gradle Calistirma Izni Ver ve APK Derle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Uretilen APK Dosyasini Yukle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: FinansERP-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk